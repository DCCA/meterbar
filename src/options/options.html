<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeterBar Settings</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main>
      <h1>MeterBar Settings</h1>

      <label><input id="notifications" type="checkbox" /> Enable local notifications</label>

      <h2>Providers</h2>
      <label><input id="claude" type="checkbox" /> Claude</label>
      <label><input id="chatgpt" type="checkbox" /> ChatGPT / Codex</label>
      <label><input id="gemini" type="checkbox" /> Gemini</label>

      <section>
        <h2>Usage history</h2>
        <p>Export your locally stored usage history (percentages and timestamps only).</p>
        <button id="export-json">Export JSON</button>
        <button id="export-csv">Export CSV</button>
      </section>

      <section>
        <h2>Privacy</h2>
        <p>MeterBar stores usage percentages, reset timestamps, provider names, and local settings. It does not store prompts, responses, uploaded files, or chat content.</p>
        <button id="clear">Clear local MeterBar data</button>
        <p id="status" role="status"></p>
      </section>
    </main>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
